context: weather
name: Weather
intro: >-
  The common weather vocabulary -- current conditions, forecasts, historical observations,
  severe-weather alerts, air quality and the stations that measure it -- distilled from the
  APIs that already exist.
tags: [Weather, Meteorology, Weather Data, Weather API, Weather Forecasting]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, features, location, timezone, timezone_offset, lat, lon, latitude, longitude]

common_fields:
  id: [uuid, guid, object_id, record_id, "@id", station_id, alert_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, sent, issued_at, issued]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified, last_updated]
  time: [timestamp, dt, datetime, valid_time, observation_time, time_epoch, date, valid_time_local, start_time, obs_time]
  temperature: [temp, temp_c, temp_f, temperature_2m, air_temperature, temperature_c, temperature_f, t]
  feels_like: [apparent_temperature, feelslike, feels_like_c, real_feel, heat_index, wind_chill]
  humidity: [relative_humidity, relative_humidity_2m, rh]
  wind_speed: [windspeed, wind_kph, wind_mph, wind_speed_10m, wspd, wind]
  wind_direction: [wind_deg, wind_dir, winddirection, wind_direction_10m, wdir]
  precipitation: [precip, precip_mm, rain, precipitation_amount, precipitation_probability, pop, qpf]
  pressure: [pressure_mb, pressure_hpa, sea_level_pressure, msl, pressure_msl, surface_pressure]
  cloud_cover: [clouds, cloudcover, cloud_cover_total]
  condition: [weather, weather_code, weathercode, conditions, summary, icon, description, text, condition_code]
  uv_index: [uv, uvi, uv_index_max]
  visibility: [vis, visibility_km]

concepts:
  current_conditions:
    path: /current
    segments: [current, current_conditions, currentconditions, current-conditions, conditions@weather|current, now, realtime, latest@observations|weather, observations@latest]
    aliases:
      dew_point: [dewpoint, dew_point_2m, dewpt]
  forecast:
    segments: [forecast, forecasts, daily@forecast|weather, hourly@forecast|weather, onecall, timeline, timelines, forecast_daily, forecast_hourly]
    aliases:
      temperature_max: [temp_max, max_temp, maxtemp_c, temperature_2m_max, high, maxtemp]
      temperature_min: [temp_min, min_temp, mintemp_c, temperature_2m_min, low, mintemp]
      daily: [days, daily_forecasts, forecastday]
      hourly: [hours, hourly_forecasts]
  historical_weather:
    path: /history
    segments: [history, historical, timemachine, archive@weather|forecast, past, observations@history|stations]
  weather_alert:
    path: /weather-alerts
    segments: [alerts, alert, warnings@weather|meteo, severe_weather, advisories@weather]
    aliases:
      event: [event_type, phenomenon, type, headline, title]
      severity: [severity_level, level, urgency]
      starts_at: [onset, effective, start, start_time, valid_from]
      ends_at: [expires, end, end_time, valid_until]
      area: [area_desc, areas, regions, zones, affected_zones]
  air_quality:
    segments: [air_quality, air-quality, airquality, aqi, air_pollution, air-pollution, pollution, pollen]
    aliases:
      aqi: [index, air_quality_index, us_aqi, european_aqi, aqi_value]
      pm25: [pm2_5, pm2.5, pm25_value]
      pm10: [pm10_value]
      ozone: [o3]
      no2: [nitrogen_dioxide]
  station:
    segments: [stations, station, weather_stations, observation_stations]
    aliases:
      name: [station_name, title]
      latitude: [lat]
      longitude: [lon, lng]
      elevation: [altitude, elev]

duplicates:
  national-weather-service: [noaa, noaa-gov, weather-gov]
  openweathermap: [openweather]

findings:
  - "Weather agrees on less than any other data context. Current conditions come closest --
    a condition, a temperature and a time, each at 36-45% -- and forecasts agree on nothing:
    every provider nests readings in time-series arrays (daily, hourly, list, timelines)
    wrapped in its own location metadata."
  - "Counted per listing, alerts looked standardised: four National Weather Service listings
    return the Common Alerting Protocol. Counted once, alerts still agree on the event and
    its severity -- the two fields every warning needs -- and little else."
  - "The physical quantities are shared even where the shapes are not: temperature, humidity,
    wind and pressure collapse to one name each through the aliases, so the vocabulary is
    usable as a dictionary even though no resource reaches core."
decisions:
  - "Forecasting is not a cohort tag: it covers demand and financial forecasting."
  - "Current conditions are `/current`, history `/history` and alerts `/weather-alerts` (bare
    `/alerts` is observability's)."
  - "NOAA, noaa.gov, weather.gov and the National Weather Service are one publisher and count
    once; OpenWeather's two listings likewise."
  - "Pollen counts as air quality."
