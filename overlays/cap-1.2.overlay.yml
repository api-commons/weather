overlay: 1.0.0
info:
  title: Weather -- cap-1.2 alignment
  version: 0.1.0-draft.20261111
  description: Marks the common Weather OpenAPI with the cap-1.2 object each schema corresponds to, and the field each property
    maps to. Generated by scripts/overlay.py from standards/cap-1.2.yml; nothing is renamed.
extends: openapi.yml
actions:
- target: $.components.schemas.WeatherAlert
  update:
    x-commons-standard:
      standard: cap-1.2
      source: https://docs.oasis-open.org/emergency/cap/v1.2/CAP-v1.2.xsd
      objects:
      - alert
      - info
      - area
      core_coverage: 1.0
      fields:
        identifier: identifier
        sender: sender
        created_at: sent
        status: status
        msg_type: msgType
        source: source
        scope: scope
        restriction: restriction
        addresses: addresses
        code: code
        note: note
        references: references
        info: info
        language: language
        category: category
        event: event
        severity: urgency
        certainty: certainty
        event_code: eventCode
        starts_at: effective
        ends_at: expires
        sender_name: senderName
        condition: description
        instruction: instruction
        area: area
        geocode: geocode
      standard_only:
      - incidents
      - responseType
      - audience
      - web
      - contact
      - parameter
      - resource
      - polygon
      - circle
      - altitude
      - ceiling
